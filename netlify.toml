# Expose all serverless functions under /api/* (rewrite, not a redirect).
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/winter-renewal"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/winter-renewal.html"
  to = "/"
  status = 301
  force = true
