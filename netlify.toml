# Expose all serverless functions under /api/* (rewrite, not a redirect).
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# /packages was renamed to /yoga-holidays (Aug 2026) — keep the old URL alive
# for links shared while it was live.
[[redirects]]
  from = "/packages"
  to = "/yoga-holidays"
  status = 301
  force = true

[[redirects]]
  from = "/packages.html"
  to = "/yoga-holidays"
  status = 301
  force = true

# /yoga-shala was renamed to /yoga (Oct 2026) — keep the old URL alive for
# links shared and indexed while it was live.
[[redirects]]
  from = "/yoga-shala"
  to = "/yoga"
  status = 301
  force = true

[[redirects]]
  from = "/yoga-shala.html"
  to = "/yoga"
  status = 301
  force = true

[[redirects]]
  from = "/winter-renewal"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/winter-renewal.html"
  to = "/"
  status = 301
  force = true
